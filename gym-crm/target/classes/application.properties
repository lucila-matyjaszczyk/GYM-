# --- H2 database connection ---
# "jdbc:h2:file:./h2-data/gymcrm" means: store the data in real files under
# a "h2-data" folder next to the project (created automatically the first
# time you run the app), so everything you save is still there the next
# time you start the program -- unlike our old in-memory Map, this
# survives restarts even without the .txt preload files.
db.driver=org.h2.Driver
db.url=jdbc:h2:file:./h2-data/gymcrm;AUTO_SERVER=TRUE
db.username=sa
db.password=
